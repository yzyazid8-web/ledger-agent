# Agent ReAct : le LLM choisit ses outils (recherche, faits XBRL, calculatrice), lit leurs
# résultats et décide de la suite. Chaque chiffre de la réponse est vérifié par des règles.

name = "agent"
pipeline = "agent"

# L'agent choisit lui-même les filtres (entreprise, exercice) de chaque recherche
[retrieval]
mode = "hybrid"
filters = "none"
lexical_weight = 0.5
candidates = 30

# Modèle qui pilote la boucle : choix des outils, lecture des résultats, réponse
[llm]
provider = "groq"
model = "openai/gpt-oss-120b"
max_tokens = 2500
temperature = 0.0
reasoning_effort = "low"
tokens_per_minute = 8000

[agent]
mode = "react"
use_xbrl = true
use_verifier = true
# 12 tours : 8 ne suffisaient pas aux questions qui demandent 3 ou 4 chiffres (réglé sur dev)
max_steps = 12
passages_per_query = 3
max_synthesis_attempts = 2

[judge]
provider = "gemini"
model = "gemini-3.5-flash-lite"
requests_per_minute = 10
