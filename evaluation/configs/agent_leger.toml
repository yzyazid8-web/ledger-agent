# Agent ReAct léger : gpt-oss-20b pilote la boucle. Solution de repli pour la démo quand le
# quota quotidien de gpt-oss-120b est épuisé.

name = "agent_leger"
pipeline = "agent"

# L'agent choisit lui-même les filtres (entreprise, exercice) de chaque recherche
[retrieval]
mode = "hybrid"
filters = "none"
lexical_weight = 0.5
candidates = 30

# Modèle qui pilote la boucle : choix des outils, lecture des résultats, réponse
[llm]
provider = "groq"
model = "openai/gpt-oss-20b"
max_tokens = 2500
temperature = 0.0
reasoning_effort = "low"
tokens_per_minute = 8000

[agent]
mode = "react"
use_xbrl = true
use_verifier = true
max_steps = 8
passages_per_query = 3
max_synthesis_attempts = 2

[judge]
provider = "gemini"
model = "gemini-3.5-flash-lite"
requests_per_minute = 10
